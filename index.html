<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Wii-Dye Portal</title>
<style>
:root{--bg:#000;--card:#111;--line:#262626;--tx:#f2f2f2;--mut:#8a8a8a;--ac:#7c9cff;--c0:#f5a623;--c1:#5aa0ff;--c2:#3ddc84}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:12px 12px 80px;max-width:560px;margin:auto}
header{display:flex;align-items:center;gap:12px;padding:8px 0 14px}
header svg{width:56px;height:56px;flex:none}
h1{font-size:22px;margin:0;letter-spacing:.5px}
header small{color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:var(--tx);font-size:16px}
.row{display:flex;gap:10px}.row>div{flex:1}
.total{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;font-size:15px;color:var(--mut)}
.total b{font-size:26px;color:var(--tx)}
button{font:inherit;cursor:pointer}
.primary{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ac);color:#000;font-weight:700;margin-top:8px}
.ghost{background:none;border:1px solid #333;color:var(--tx);border-radius:10px;padding:10px 14px}
#cancel{display:none;width:100%;margin-top:8px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:11px;color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.chip{white-space:nowrap;background:none;border:1px solid #333;color:var(--mut);border-radius:20px;padding:7px 14px;font-size:14px}
.chip.on{background:var(--tx);color:#000;border-color:var(--tx)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:10px}
.card h3{margin:0 0 2px;font-size:18px}
.card a{color:var(--ac);text-decoration:none;font-size:14px}
.amt{text-align:right;font-weight:700;font-size:20px}.amt small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.dates{display:flex;gap:16px;margin:10px 0;font-size:13px;color:var(--mut)}
.dates b{color:var(--tx);font-weight:600}.late b{color:#ff6b6b}
.track{display:flex;gap:6px}
.step{flex:1;padding:10px 4px;border-radius:10px;border:1px solid #333;background:#000;color:var(--mut);font-size:13px}
.step.done.s0{background:var(--c0);color:#000;border-color:var(--c0)}
.step.done.s1{background:var(--c1);color:#000;border-color:var(--c1)}
.step.done.s2{background:var(--c2);color:#000;border-color:var(--c2)}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button,.acts a{flex:1;text-align:center;padding:9px;border:1px solid #333;border-radius:10px;background:none;color:var(--tx);font-size:13px}
.acts .del{color:#ff6b6b}
.empty{text-align:center;color:var(--mut);padding:20px}
.bk{display:flex;gap:8px}.bk button,.bk label{flex:1;margin:0;text-align:center;padding:12px;border:1px solid #333;border-radius:10px;color:var(--tx);font-size:14px;cursor:pointer;background:none}
#lastbk{font-size:12px;color:var(--mut);margin-top:8px;text-align:center}
</style></head><body>

<header>
<svg viewBox="0 0 64 64" aria-label="Wii-Dye logo">
<g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M8 12q4-5 8 0q4-5 8 0"/><path d="M26 6q3-4 6 0q3-4 6 0"/><path d="M42 13q3-4 6 0q3-4 6 0"/>
<path fill="#111" d="M20 22h24l3 36H35l-3-22-3 22H17z"/><rect x="20" y="16" width="24" height="6" fill="#111"/>
<path d="M32 22v14M24 28h-3M43 28h-3" stroke-width="1.2"/></g></svg>
<div><h1>Wii-Dye Portal</h1><small>Black jeans re-dye · Durban</small></div>
</header>

<div class="panel">
<label for="name">Customer name</label><input id="name" autocomplete="off">
<label for="phone">Phone</label><input id="phone" type="tel" inputmode="tel" placeholder="e.g. 082 123 4567">
<div class="row">
<div><label for="count">Pairs of jeans</label><input id="count" type="number" min="1" value="1" inputmode="numeric"></div>
<div><label for="status">Status</label><select id="status"><option>Collected</option><option>Dyed</option><option>Delivered</option></select></div>
</div>
<div class="row">
<div><label for="pickup">Pickup date</label><input id="pickup" type="date"></div>
<div><label for="delivery">Delivery date</label><input id="delivery" type="date"></div>
</div>
<div class="total"><span id="calc">1 × R70</span><b id="tot">R70</b></div>
<button class="primary" id="save">Add order</button>
<button class="ghost" id="cancel">Cancel edit</button>
</div>

<div class="stats" id="stats"></div>
<div class="chips" id="chips"></div>
<div id="list"></div>

<div class="panel">
<div class="bk">
<button id="exp">⬇ Export backup</button>
<label>⬆ Import backup<input id="imp" type="file" accept=".json,application/json" hidden></label>
</div>
<div id="lastbk"></div>
</div>

<script>
const PRICE=70, KEY='wiidye.v1', ST=['Collected','Dyed','Delivered'];
let orders=[], editing=null, filter='All';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('en-ZA',{day:'numeric',month:'short'}):'—';

function load(){try{orders=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){orders=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(orders))}catch(e){alert('Could not save on this device. Export a backup now.')}}

function updTotal(){const n=Math.max(0,parseInt($('count').value)||0);$('calc').textContent=n+' × R'+PRICE;$('tot').textContent='R'+n*PRICE}
function resetForm(){editing=null;$('name').value='';$('phone').value='';$('count').value=1;$('status').value='Collected';$('pickup').value=today();$('delivery').value='';$('save').textContent='Add order';$('cancel').style.display='none';updTotal()}

function card(o){
  const i=ST.indexOf(o.status);
  const late=o.delivery&&o.delivery<today()&&o.status!=='Delivered';
  let wa='';const dg=o.phone.replace(/\D/g,'');
  if(dg){const n=dg.startsWith('0')?'27'+dg.slice(1):dg;wa=`<a href="https://wa.me/${n}" target="_blank" rel="noopener">WhatsApp</a>`}
  return `<div class="card"><div class="top"><div><h3>${esc(o.name)}</h3>${o.phone?`<a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>`:''}</div>
  <div class="amt">R${o.count*PRICE}<small>${o.count} pair${o.count>1?'s':''}</small></div></div>
  <div class="dates"><span>Pickup <b>${fmt(o.pickup)}</b></span><span class="${late?'late':''}">Delivery <b>${fmt(o.delivery)}${late?' (overdue)':''}</b></span></div>
  <div class="track">${ST.map((s,k)=>`<button class="step s${k} ${k<=i?'done':''}" data-act="st" data-id="${o.id}" data-s="${s}">${s}</button>`).join('')}</div>
  <div class="acts"><button data-act="edit" data-id="${o.id}">Edit</button>${wa}<button class="del" data-act="del" data-id="${o.id}">Delete</button></div></div>`;
}

function render(){
  const jeans=orders.reduce((s,o)=>s+o.count,0);
  $('stats').innerHTML=`<div><b>${orders.length}</b><span>Orders</span></div><div><b>${jeans}</b><span>Pairs</span></div><div><b>R${jeans*PRICE}</b><span>Order value</span></div>`;
  $('chips').innerHTML=['All',...ST].map(s=>{const n=s==='All'?orders.length:orders.filter(o=>o.status===s).length;return `<button class="chip ${filter===s?'on':''}" data-f="${s}">${s} ${n}</button>`}).join('');
  const list=[...orders].sort((a,b)=>b.created-a.created).filter(o=>filter==='All'||o.status===filter);
  $('list').innerHTML=list.length?list.map(card).join(''):'<p class="empty">No orders here yet.</p>';
  const lb=localStorage.getItem(KEY+'.bk');
  $('lastbk').textContent=lb?'Last backup: '+new Date(+lb).toLocaleString('en-ZA'):'No backup yet – export one regularly.';
}

$('count').oninput=updTotal;
$('save').onclick=()=>{
  const name=$('name').value.trim(), count=parseInt($('count').value)||0;
  if(!name){alert('Enter the customer name.');return}
  if(count<1){alert('Jeans count must be at least 1.');return}
  const data={name,phone:$('phone').value.trim(),count,status:$('status').value,pickup:$('pickup').value,delivery:$('delivery').value};
  if(editing){const o=orders.find(x=>x.id===editing);if(o)Object.assign(o,data)}
  else orders.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),created:Date.now(),...data});
  save();resetForm();render();
};
$('cancel').onclick=resetForm;

$('chips').onclick=e=>{const f=e.target.dataset.f;if(f){filter=f;render()}};
$('list').onclick=e=>{
  const b=e.target.closest('button');if(!b||!b.dataset.act)return;
  const o=orders.find(x=>x.id===b.dataset.id);if(!o)return;
  if(b.dataset.act==='st'){o.status=b.dataset.s;save();render()}
  if(b.dataset.act==='del'&&confirm('Delete order for '+o.name+'?')){orders=orders.filter(x=>x!==o);save();render()}
  if(b.dataset.act==='edit'){editing=o.id;$('name').value=o.name;$('phone').value=o.phone;$('count').value=o.count;$('status').value=o.status;$('pickup').value=o.pickup;$('delivery').value=o.delivery;$('save').textContent='Save changes';$('cancel').style.display='block';updTotal();scrollTo({top:0,behavior:'smooth'})}
};

$('exp').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'Wii-Dye Portal',version:1,exported:new Date().toISOString(),orders},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wii-dye-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  try{localStorage.setItem(KEY+'.bk',Date.now())}catch(e){}render();
};
$('imp').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result),arr=Array.isArray(d)?d:d.orders;if(!Array.isArray(arr))throw 0;
    const clean=arr.filter(o=>o&&o.id&&o.name).map(o=>({id:String(o.id),name:String(o.name),phone:String(o.phone||''),count:Math.max(1,parseInt(o.count)||1),pickup:o.pickup||'',delivery:o.delivery||'',status:ST.includes(o.status)?o.status:'Collected',created:+o.created||Date.now()}));
    if(!clean.length){alert('No orders found in that file.');return}
    if(!confirm('Import '+clean.length+' orders and merge with current data?'))return;
    const map=new Map(orders.map(o=>[o.id,o]));clean.forEach(o=>map.set(o.id,o));
    orders=[...map.values()];save();render();alert('Import complete.');
  }catch(x){alert('That file is not a valid Wii-Dye backup.')}e.target.value=''};
  r.readAsText(f);
};

// Installability: manifest built at runtime (icons drawn on canvas)
(function(){
  if(!/^https?:$/.test(location.protocol))return;
  try{
    const icon=sz=>{const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d');
      x.fillStyle='#000';x.fillRect(0,0,sz,sz);x.scale(sz/64,sz/64);
      x.strokeStyle='#fff';x.fillStyle='#111';x.lineWidth=2;x.lineCap=x.lineJoin='round';
      x.beginPath();x.moveTo(20,22);x.lineTo(44,22);x.lineTo(47,58);x.lineTo(35,58);x.lineTo(32,36);x.lineTo(29,58);x.lineTo(17,58);x.closePath();x.fill();x.stroke();
      x.fillRect(20,16,24,6);x.strokeRect(20,16,24,6);
      [[8,12],[26,6],[42,13]].forEach(([a,b])=>{x.beginPath();x.moveTo(a,b);x.quadraticCurveTo(a+4,b-5,a+8,b);x.quadraticCurveTo(a+12,b-5,a+16,b);x.stroke()});
      return c.toDataURL('image/png')};
    const m={name:'Wii-Dye Portal',short_name:'Wii-Dye',start_url:location.href.split('#')[0],scope:new URL('./',location.href).href,display:'standalone',background_color:'#000000',theme_color:'#000000',
      icons:[{src:icon(192),sizes:'192x192',type:'image/png',purpose:'any'},{src:icon(512),sizes:'512x512',type:'image/png',purpose:'any'}]};
    const l=document.createElement('link');l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
  }catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
})();

load();resetForm();render();
</script>
</body></html>
